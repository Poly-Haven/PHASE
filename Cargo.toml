[package]
name = "phase"
version = "1.8.0"
edition = "2021"
description = "PHASE — internal asset pipeline tool"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.27", default-features = false, features = [
  "default_fonts",
  "glow",
] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["image"] }
image = { version = "0.24", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  # Header-only reads for the HDRI resolution check (validation::hdri_resolution).
  "openexr",
  "hdr",
  # Card ingest accepts .tif/.tiff stills.
  "tiff",
] }
resvg = "0.45"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
blake3 = "1"
sha2 = "0.10"
filetime = "0.2"
open = "5"
rfd = "0.14"
dirs = "5"
semver = "1"
self_update = { version = "0.44", default-features = false, features = [
  "reqwest",
  "rustls",
  "archive-zip",
  "compression-zip-deflate",
] }
anyhow = "1"
thiserror = "1"
log = "0.4"
simplelog = "0.12"
tiny-skia = "0.11"
usvg = "0.45"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
notify = "8.2.0"
# Camera RAW decode for card ingest. LGPL-2.1 — see NOTICE.
rawler = "0.6"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
# No `panic = "abort"`: ingest wraps every RAW decode in `catch_unwind` because
# rawler panics on some malformed files, and detecting those without taking
# PHASE down with them is the entire point of decoding them.
